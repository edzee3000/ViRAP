<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>摄影调色 · 配对预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101317;color:#e7edf3}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#181e25;border-bottom:1px solid #303a46}h1{font-size:22px;margin:0 0 8px}.muted{color:#a8b6c5;font-size:13px}nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit;color:inherit;background:#232d38;border:1px solid #425064;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{background:#34445a}button:disabled{opacity:.4;cursor:default}input[type=search]{width:260px}input[type=number]{width:90px}#stats{margin-top:12px;color:#9bd5c7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px 24px}.card{min-width:0;background:#191f27;border:1px solid #35404f;border-radius:12px;overflow:hidden}.label{display:flex;justify-content:space-between;gap:12px;padding:12px 15px;font-size:18px;font-weight:600}.role{font-size:12px;color:#a8b6c5;font-weight:400;align-self:center}.stage{height:calc(100vh - 350px);min-height:280px;position:relative;display:flex;align-items:center;justify-content:center;background:#090c10}.stage img{height:100%;width:100%;object-fit:contain;cursor:zoom-in}.loading{position:absolute;pointer-events:none;background:#111b;padding:8px;border-radius:6px}.details{padding:12px 15px;min-height:100px;overflow-wrap:anywhere;line-height:1.7;font-size:13px}a{color:#9ccbf7}.footer{padding:0 24px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}dialog{width:98vw;height:97vh;max-width:none;max-height:none;background:#0a0d12;color:inherit;border:1px solid #526078;padding:12px}dialog::backdrop{background:#000d}dialog img{width:100%;height:calc(100% - 50px);object-fit:contain}dialog .top{display:flex;justify-content:space-between;align-items:center;height:45px}#empty{padding:50px;text-align:center}#pairId{font-family:monospace}@media(max-width:760px){.pair{grid-template-columns:1fr;padding:12px}.stage{height:48vh}header{padding:16px}.role{font-size:11px}.footer{padding:0 14px 20px}}
[hidden]{display:none!important}
</style>
<header><h1>摄影调色 · 配对预览</h1><div class="muted">左侧输入图决定保留的内容，右侧参考图提供色调。完整显示构图，点击图片可放大；此页仅供查看，不修改配对和原图。</div>
<nav><select id="split" aria-label="配对集合"><option value="pilot">首批试运行 · 200 对</option><option value="all">全部配对</option><option value="train">训练集</option><option value="validation">验证集</option><option value="test">测试集</option><option value="diagnostic">同图诊断</option></select><input id="search" type="search" placeholder="搜索配对编号、文件名、来源" aria-label="搜索"><button id="prev">← 上一对</button><button id="next">下一对 →</button><button id="random">随机看一对</button><label>跳至 <input id="jump" type="number" min="1" value="1" aria-label="跳至序号"></label><button id="go">前往</button></nav>
<div id="stats" aria-live="polite"></div></header>
<div id="empty" hidden>没有符合条件的配对。</div>
<main class="pair" id="cards"><section class="card"><div class="label">输入图 <span class="role">Content · 保留内容与结构</span></div><div class="stage"><span class="loading" id="contentLoading">正在加载…</span><img id="contentImage" alt="输入图"></div><div class="details" id="contentDetails"></div></section><section class="card"><div class="label">参考图 <span class="role">Reference · 提供色调风格</span></div><div class="stage"><span class="loading" id="referenceLoading">正在加载…</span><img id="referenceImage" alt="参考图"></div><div class="details" id="referenceDetails"></div></section></main>
<footer class="footer"><span id="pairId"></span><span class="muted">← / → 翻页 · 空格下一对 · Esc 关闭放大 · 自动保存浏览位置</span></footer>
<dialog id="zoom"><div class="top"><span id="zoomTitle"></span><button id="close">关闭 Esc</button></div><img id="zoomImage" alt="放大预览"></dialog>
<script>
const DATA=__PAIRS__,IMAGES=__IMAGES__,$=s=>document.querySelector(s),KEY='nju-photo-pairs-preview-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
$('#split').value=saved.split||'pilot';$('#search').value=saved.search||'';
let visible=[],index=0,token=0;
const labels={train:'训练集',validation:'验证集',test:'测试集',diagnostic:'同图诊断'};
function persist(){try{localStorage.setItem(KEY,JSON.stringify({split:$('#split').value,search:$('#search').value,pairId:visible[index]?.pair_id}))}catch(e){}}
function filter(preferred){let split=$('#split').value,q=$('#search').value.trim().toLowerCase();visible=DATA.filter(p=>(split==='all'||split==='pilot'&&p.pilot||p.split===split)&&(!q||[p.pair_id,p.content_key,p.reference_key].join(' ').toLowerCase().includes(q)));let pos=visible.findIndex(p=>p.pair_id===preferred);show(pos>=0?pos:0)}
function details(role,p){const r=IMAGES[p[role+'_key']],box=$('#'+role+'Details');box.replaceChildren();for(const text of [p[role+'_key'],`${r.width} × ${r.height}${r.artists?' · '+r.artists:''}`]){let line=document.createElement('div');line.textContent=text;box.append(line)}let a=document.createElement('a');a.textContent='打开原图 ↗';a.href=p[role+'_path'];a.target='_blank';a.rel='noopener';box.append(a)}
function show(i){index=Math.max(0,Math.min(i,visible.length-1));let p=visible[index],t=++token;$('#empty').hidden=!!p;$('#cards').hidden=!p;$('#prev').disabled=!p||index===0;$('#next').disabled=!p||index===visible.length-1;$('#random').disabled=!p;$('#jump').max=visible.length;$('#jump').value=p?index+1:0;$('#stats').textContent=p?`${index+1} / ${visible.length.toLocaleString()} 对 · ${labels[p.split]}${p.pilot?' · 首批 200 对':''} · 全部共 ${DATA.length.toLocaleString()} 对`:'0 对';$('#pairId').textContent=p?p.pair_id+' · '+(p.split==='diagnostic'?'同图诊断，输出不预设为恒等':'固定种子随机配对'):'';if(!p)return;for(const role of ['content','reference']){let img=$('#'+role+'Image'),loading=$('#'+role+'Loading');loading.hidden=false;loading.textContent='正在加载…';img.onload=()=>{if(t===token)loading.hidden=true};img.onerror=()=>{if(t===token)loading.textContent='加载失败，请尝试打开原图'};img.src=IMAGES[p[role+'_key']].preview;details(role,p)}persist()}
$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);$('#random').onclick=()=>{if(visible.length>1){let offset=1+Math.floor(Math.random()*(visible.length-1));show((index+offset)%visible.length)}};$('#split').onchange=()=>filter();$('#search').oninput=()=>filter();$('#go').onclick=()=>show((Number($('#jump').value)||1)-1);$('#jump').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
for(const role of ['content','reference'])$('#'+role+'Image').onclick=()=>{let p=visible[index];if(!p)return;$('#zoomTitle').textContent=(role==='content'?'输入图':'参考图')+' · '+p[role+'_key'];$('#zoomImage').src=IMAGES[p[role+'_key']].preview;$('#zoom').showModal()};$('#close').onclick=()=>$('#zoom').close();
document.addEventListener('keydown',e=>{if(e.target.matches('input,select')||$('#zoom').open||(e.key===' '&&e.target.matches('button')))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(index+1)}else if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}});
filter(saved.pairId);
</script></html>
