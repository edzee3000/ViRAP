<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部图片 · 逐张审核</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#18212d;--line:#344355;--text:#edf3fa;--muted:#adbdcf;--accent:#7eb6ff}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif}header{flex:none;padding:12px 20px 10px;border-bottom:1px solid var(--line);background:#17202a}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}h1{font-size:19px;margin:0}.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,input,a.button{font:inherit;color:var(--text);background:#263345;border:1px solid #435670;border-radius:7px;padding:7px 10px}button,a.button{cursor:pointer;text-decoration:none}button:hover,a.button:hover{background:#374b63}button:disabled{opacity:.35;cursor:default}input[type=search]{min-width:190px;flex:1;max-width:380px}#stats{font-size:13px;color:#9fdccc}#notice{font-size:12px;min-height:16px;margin-top:7px;color:var(--muted)}main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}#imageInfo{flex:none;padding:8px 20px;display:flex;align-items:baseline;gap:12px;min-height:36px;white-space:nowrap;overflow:hidden}#imageTitle{overflow:hidden;text-overflow:ellipsis;font-weight:600}#imageMeta{color:var(--muted);flex:none;font-size:12px}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0a0f15;display:flex;align-items:center;justify-content:center;padding:8px}#currentImage{display:block;width:100%;height:100%;object-fit:contain;opacity:0}#currentImage.ready{opacity:1}#stage.zoom{display:block;overflow:auto;padding:0}#stage.zoom #currentImage{width:auto;height:auto;max-width:none;max-height:none;margin:0 auto}#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 22px;text-align:center;background:#111a25e6;border:1px solid #37485c;border-radius:9px;max-width:80%}#message[hidden]{display:none}footer{flex:none;padding:11px 20px 12px;background:#17202a;border-top:1px solid var(--line)}.navigation{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.navigation button{min-height:42px;padding:9px 18px;font-size:15px}#next{background:#244a78;border-color:#4d83be}#reject{background:#6d303b;border-color:#b86270}#reject:hover{background:#934052}#position{min-width:116px;text-align:center;font-variant-numeric:tabular-nums}#shortcuts{text-align:center;font-size:12px;margin-top:8px;color:var(--muted)}#jump{width:78px;min-width:0}#details{position:absolute;right:15px;top:45px;z-index:3;width:min(560px,90vw);max-height:70vh;overflow:auto;background:#1a2533f5;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 12px 40px #0009}#details[hidden]{display:none}#details p{overflow-wrap:anywhere;margin:8px 0;line-height:1.5}#details a{color:#98c7ff}.error{color:#ffb9b9!important}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #9ac7ff;outline-offset:2px}@media(max-width:800px){header{padding:9px 10px}.heading{display:block}#stats{margin-top:5px}h1{font-size:17px}.toolbar{gap:5px}select{max-width:46vw}button,select,input,a.button{padding:6px 8px;font-size:12px}#imageInfo{padding:6px 10px;display:block}#imageMeta{font-size:11px}footer{padding:8px}.navigation{gap:6px}.navigation button{font-size:13px;padding:7px 10px;min-height:38px}#shortcuts{font-size:11px}#notice{font-size:11px}}
</style></head><body>
<header><div class="heading"><h1>全部图片 · 逐张审核</h1><div id="stats" aria-live="polite"></div></div><div class="toolbar">
<select id="source" aria-label="图片来源"><option value="">全部来源</option></select>
<select id="area" aria-label="原图范围"><option value="">全部原图范围</option></select>
<select id="view" aria-label="审核状态"><option value="kept">未剔除（默认保留）</option><option value="rejected">本轮已剔除</option><option value="all">全部图片</option></select>
<input id="search" type="search" placeholder="搜索文件名、专辑、歌手或类别" aria-label="搜索图片">
<button id="resume">继续未浏览</button><button id="export">导出审核 JSON</button><button id="import">导入 JSON</button><input id="importFile" type="file" accept=".json" hidden>
</div><div id="notice">默认保留，无需逐张点保留。剔除标记暂存在本机浏览器，导出 JSON 后再统一删除原图。</div></header>
<main><div id="imageInfo"><span id="imageTitle"></span><span id="imageMeta"></span></div><div id="stage" aria-busy="false"><img id="currentImage" alt="当前审核图片"><div id="message" hidden></div></div><aside id="details" hidden></aside></main>
<footer><div class="navigation"><button id="prev">← 上一张</button><span id="position"></span><button id="next">下一张 →</button><button id="reject">剔除并下一张 · X</button><button id="undo">撤销剔除</button><button id="zoom">放大</button><a id="original" class="button" target="_blank" rel="noopener">查看原图</a><button id="detailButton">详情</button><button id="fullscreen">全屏 · F</button><input id="jump" type="number" min="1" aria-label="跳转到第几张"><button id="go">跳转</button></div><div id="shortcuts">→ / 空格：下一张（自动保留）　←：上一张　X / Delete：剔除并下一张　Ctrl+Z：撤销　F：全屏</div></footer>
<script>
const DATA=__DATA__;
const CONFIG=__CONFIG__;
const STORAGE_KEY='nju-all-images-default-keep-v2';
const $=s=>document.querySelector(s);
const byKey=new Map(DATA.map(r=>[r.key,r]));
const SOURCE_NAMES={'DIV2K':'DIV2K','Unsplash_Lite':'Unsplash Lite','Wikimedia_Commons':'Wikimedia Commons','Album_Covers':'专辑封面','Phone Photo':'手机照片'};
let state={rejects:{},seen:{},cursorKey:null,source:'',area:'',view:'kept',search:'',history:[]};
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&typeof saved==='object'){state={...state,...saved};state.rejects={...saved.rejects};state.seen={...saved.seen};state.history=Array.isArray(saved.history)?saved.history.slice(-100):[]}}catch(e){}
for(const key of CONFIG.seedSeen||[])if(byKey.has(key))state.seen[key]=true;
for(const key of Object.keys(state.rejects))if(!byKey.has(key))delete state.rejects[key];
for(const key of Object.keys(state.seen))if(!byKey.has(key))delete state.seen[key];
let visible=[],cursor=0,loading=false,currentKey=null,loadToken=0,preload=null;
function say(message,error=false){$('#notice').textContent=message;$('#notice').classList.toggle('error',error)}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){say('浏览器未能保存审核进度，请立即导出 JSON。',true)}}
function stats(){const rejected=Object.keys(state.rejects).filter(k=>byKey.has(k)&&state.rejects[k]).length;const seen=Object.keys(state.seen).filter(k=>byKey.has(k)).length;$('#stats').textContent=`共 ${DATA.length.toLocaleString()} 张 · 默认保留 ${(DATA.length-rejected).toLocaleString()} · 本轮剔除 ${rejected} · 已浏览 ${seen}`;$('#undo').disabled=!state.history.length}
function buildList(){const q=state.search.trim().toLowerCase();visible=DATA.filter(r=>(!state.source||r.source===state.source)&&(!state.area||r.area===state.area)&&(state.view==='all'||(state.view==='rejected'?!!state.rejects[r.key]:!state.rejects[r.key]))&&(!q||[r.id,r.title,r.hint,r.artists,r.path].join(' ').toLowerCase().includes(q)))}
function message(text){$('#message').textContent=text;$('#message').hidden=false}
function resetZoom(){$('#stage').classList.remove('zoom');$('#stage').scrollTop=0;$('#stage').scrollLeft=0;$('#zoom').textContent='放大'}
function detailRow(label,value,link=false){const p=document.createElement('p');const b=document.createElement('b');b.textContent=label+'：';p.append(b);if(link&&value){const a=document.createElement('a');a.href=value;a.target='_blank';a.rel='noopener';a.textContent=value;p.append(a)}else p.append(document.createTextNode(value||'—'));return p}
function details(r){const panel=$('#details');panel.replaceChildren();panel.append(detailRow('来源',SOURCE_NAMES[r.source]||r.source),detailRow('范围',r.area),detailRow('文件',r.path),detailRow('原尺寸',`${r.width} × ${r.height}`),detailRow('专辑或说明',r.title),detailRow('歌手或摄影师',r.artists),detailRow('辅助类别',r.hint),detailRow('质量提示',r.flags.join('；')),detailRow('来源页',r.source_page,true));if(r.preview!==r.href)panel.append(detailRow('显示', '为流畅浏览使用完整构图的大尺寸预览；“查看原图”打开原始文件'))}
function show(index){cursor=Math.max(0,Math.min(index,visible.length));resetZoom();$('#details').hidden=true;const r=visible[cursor];currentKey=r?r.key:null;const token=++loadToken;loading=!!r;$('#stage').setAttribute('aria-busy',r?'true':'false');$('#currentImage').classList.remove('ready');$('#reject').disabled=true;$('#zoom').disabled=!r;$('#detailButton').disabled=!r;$('#prev').disabled=cursor<=0;$('#next').disabled=cursor>=visible.length;$('#jump').max=String(visible.length);$('#position').textContent=visible.length?`${Math.min(cursor+1,visible.length)} / ${visible.length}`:'0 / 0';
 if(!r){$('#currentImage').removeAttribute('src');$('#imageTitle').textContent='';$('#imageMeta').textContent='';$('#original').removeAttribute('href');message(visible.length?'已到当前列表末尾，可返回上一张或导出审核结果。':'当前筛选范围没有图片。');stats();save();return}
 state.cursorKey=r.key;$('#imageTitle').textContent=r.title||r.id;$('#imageMeta').textContent=`${SOURCE_NAMES[r.source]||r.source} · ${r.width}×${r.height} · ${state.rejects[r.key]?'本轮已剔除':'默认保留'}`;$('#original').href=r.href;$('#jump').value=String(cursor+1);$('#reject').textContent=state.rejects[r.key]?'恢复保留并下一张':'剔除并下一张 · X';details(r);message('正在加载完整图片…');
 const loaded=()=>{if(token!==loadToken)return;loading=false;$('#stage').setAttribute('aria-busy','false');$('#currentImage').classList.add('ready');$('#message').hidden=true;$('#reject').disabled=false;state.seen[r.key]=true;stats();save();const upcoming=visible[cursor+1];if(upcoming){preload=new Image();preload.src=upcoming.preview}};
 $('#currentImage').onload=loaded;$('#currentImage').onerror=()=>{if(token!==loadToken)return;loading=false;$('#stage').setAttribute('aria-busy','false');$('#reject').disabled=false;message('图片无法显示。可点“查看原图”核查，或继续下一张；不会自动剔除。');say('当前图片加载失败，没有自动更改其保留状态。',true)};$('#currentImage').src=r.preview;$('#currentImage').alt=r.title||r.id;stats();save();}
function refresh(preferredKey=null,position=0){buildList();const i=preferredKey?visible.findIndex(r=>r.key===preferredKey):-1;show(i>=0?i:position)}
function next(){if(cursor<visible.length)show(cursor+1)}
function previous(){if(cursor>0)show(cursor-1)}
function toggleReject(){if(loading)return;const r=visible[cursor];if(!r)return;const old=!!state.rejects[r.key],nextKey=visible[cursor+1]?.key;const oldPosition=cursor;state.history.push({key:r.key,wasRejected:old});state.history=state.history.slice(-100);if(old)delete state.rejects[r.key];else state.rejects[r.key]=true;save();buildList();if(nextKey){const i=visible.findIndex(x=>x.key===nextKey);show(i>=0?i:Math.min(oldPosition,visible.length))}else show(visible.length);say(old?'已恢复保留。所有操作可通过导出的 JSON 保存。':'已标记剔除；原图暂未删除，可点击“撤销剔除”。')}
function undo(){const action=state.history.pop();if(!action)return;if(action.wasRejected)state.rejects[action.key]=true;else delete state.rejects[action.key];if(state.view==='rejected'&&!state.rejects[action.key]){state.view='kept';$('#view').value='kept'}else if(state.view==='kept'&&state.rejects[action.key]){state.view='all';$('#view').value='all'}save();refresh(action.key);say('已撤销上一次状态更改。')}
function zoom(){if(!visible[cursor])return;const on=$('#stage').classList.toggle('zoom');$('#zoom').textContent=on?'完整适应':'放大'}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){say('浏览器未能进入全屏，可使用浏览器的 F11。')}}
for(const s of [...new Set(DATA.map(r=>r.source))])$('#source').add(new Option(`${SOURCE_NAMES[s]||s}（${DATA.filter(r=>r.source===s).length}）`,s));
for(const a of [...new Set(DATA.map(r=>r.area))])$('#area').add(new Option(a,a));
if(![...$('#source').options].some(o=>o.value===state.source))state.source='';if(![...$('#area').options].some(o=>o.value===state.area))state.area='';if(!['kept','rejected','all'].includes(state.view))state.view='kept';
$('#source').value=state.source;$('#area').value=state.area;$('#view').value=state.view;$('#search').value=state.search;
for(const [selector,property] of [['#source','source'],['#area','area'],['#view','view'],['#search','search']])$(selector).addEventListener(property==='search'?'input':'change',()=>{state[property]=$(selector).value;refresh(null,0)});
$('#prev').onclick=previous;$('#next').onclick=next;$('#reject').onclick=toggleReject;$('#undo').onclick=undo;$('#zoom').onclick=zoom;$('#fullscreen').onclick=fullscreen;$('#detailButton').onclick=()=>{$('#details').hidden=!$('#details').hidden};$('#go').onclick=()=>show(Math.max(0,(parseInt($('#jump').value)||1)-1));$('#jump').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#resume').onclick=()=>{buildList();const i=visible.findIndex((r,j)=>j>=cursor&&!state.seen[r.key]);const fallback=i>=0?i:visible.findIndex(r=>!state.seen[r.key]);if(fallback>=0)show(fallback);else say('当前筛选范围的图片都已浏览过；未剔除的图片默认保留。')};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.altKey||e.repeat)return;const key=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();undo();return}if(e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();previous()}else if(key==='x'||e.key==='Delete'){e.preventDefault();toggleReject()}else if(key==='f'){e.preventDefault();fullscreen()}else if(e.key==='Escape'){$('#details').hidden=true;resetZoom()}});
$('#export').onclick=()=>{const rejected=DATA.filter(r=>state.rejects[r.key]);const payload={collection:'nju-all-images-default-keep-v2',exported_at:new Date().toISOString(),total:DATA.length,default_decision:'keep',retained_count:DATA.length-rejected.length,rejected_count:rejected.length,seen_count:Object.keys(state.seen).length,seen_keys:Object.keys(state.seen).filter(k=>byKey.has(k)),cursor_key:state.cursorKey,reviewed:rejected.map(r=>({key:r.key,source:r.source,id:r.id,path:r.href,decision:'reject'})),instructions:'Only reviewed entries with decision reject should be deleted. All images not explicitly mentioned are retained.'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='photo-review-default-keep-'+new Date().toISOString().replaceAll(':','-').slice(0,19)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);say(`已导出 ${rejected.length} 条剔除记录；其余 ${DATA.length-rejected.length} 张默认保留。`)};
$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let matched=0;for(const file of e.target.files){const obj=JSON.parse(await file.text());if(!Array.isArray(obj.reviewed))throw new Error('JSON缺少reviewed记录');for(const r of obj.reviewed){if(!byKey.has(r.key))continue;if(r.decision==='reject'){state.rejects[r.key]=true;state.seen[r.key]=true;matched++}else if(r.decision==='keep'){delete state.rejects[r.key];state.seen[r.key]=true;matched++}}for(const key of obj.seen_keys||[])if(byKey.has(key))state.seen[key]=true}save();refresh(state.cursorKey);say(`已合并 ${matched} 条有效审核记录；JSON未提及的图片状态未被改动。`)}catch(err){say('导入失败：'+err.message,true)}finally{e.target.value=''}};
$('#importFile').multiple=true;
refresh(state.cursorKey,0);
</script></body></html>
