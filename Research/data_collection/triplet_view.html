<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摄影调色 · 三元组对比</title>
<style>
:root{color-scheme:dark;font:15px system-ui,"Microsoft YaHei",sans-serif;background:#101419;color:#e9eff5}*{box-sizing:border-box}body{margin:0}header{padding:17px 22px;background:#19212b;border-bottom:1px solid #364354}h1{font-size:22px;margin:0 0 7px}.muted{font-size:13px;color:#a9b7c7}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}button,select,input{font:inherit;color:inherit;background:#263342;border:1px solid #465a70;border-radius:7px;padding:8px 11px}button{cursor:pointer}button:hover{background:#374d64}button:disabled{opacity:.4;cursor:default}#search{width:230px}#jump{width:80px}.danger{border-color:#c47777}.good{border-color:#69b8a3}#stats{margin-top:10px;color:#a0d8cb}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:16px 20px}.card{background:#19212a;border:1px solid #364555;border-radius:10px;overflow:hidden;min-width:0}.label{padding:12px 13px;display:flex;justify-content:space-between;font-weight:600;font-size:17px}.label span{font-size:12px;color:#a8b6c5;font-weight:400}.stage{height:calc(100vh - 370px);min-height:300px;position:relative;background:#090d12;display:flex;align-items:center;justify-content:center}.stage img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.wait{position:absolute;background:#18232edb;padding:8px;border-radius:6px;pointer-events:none}.detail{padding:10px 13px;font-size:12px;overflow-wrap:anywhere;line-height:1.8;min-height:70px}a{color:#9ecfff}footer{padding:0 22px 18px;line-height:1.8}#message{color:#e8bf83}dialog{width:98vw;height:97vh;max-width:none;max-height:none;background:#0b1016;color:inherit;border:1px solid #637c94}dialog::backdrop{background:#000d}dialog img{width:100%;height:calc(100% - 48px);object-fit:contain}dialog .top{display:flex;justify-content:space-between;align-items:center;height:40px}[hidden]{display:none!important}#empty{padding:50px;text-align:center}@media(max-width:850px){.grid{grid-template-columns:1fr}.stage{height:55vh}header{padding:14px}.grid{padding:12px}}
</style>
<header><h1>摄影调色 · 三元组对比</h1><div class="muted">输入图 → 参考图 → 输出图 · 完整构图，不裁切 · 输出直接显示生成 PNG，点击可放大。默认保留；标记只针对本组三元组，不删除原图。</div><nav><select id="split" aria-label="集合"><option value="pilot">首批 200 组</option><option value="all">全部 60,000 组</option><option value="train">训练集 · 59,100</option><option value="validation">验证集 · 400</option><option value="test">测试集 · 400</option><option value="diagnostic">同图诊断 · 100</option></select><input id="search" type="search" placeholder="搜索编号、来源或文件名"><button id="prev">← 上一组</button><button id="next">下一组 →</button><button id="random">随机一组</button><label>跳至 <input id="jump" type="number" min="1" value="1"></label><button id="go">前往</button></nav><nav><button id="reject" class="danger">剔除并下一组 X</button><button id="star" class="good">标为优质 S</button><button id="undo">撤销剔除 Ctrl+Z</button><button id="export">导出审核 JSON</button><button id="import">导入审核</button><input id="file" type="file" accept=".json" hidden></nav><div id="stats" aria-live="polite">正在连接 Trinity…</div></header>
<div id="empty" hidden>没有符合条件的三元组。</div><main class="grid" id="cards"></main><footer><div id="current"></div><div id="message"></div><div class="muted">← / → 或空格翻页 · X 剔除 · S 优质 · Ctrl+Z 撤销 · Esc 关闭放大。审核记录保存在本机浏览器，请定期导出；页面不会修改远端照片。</div></footer>
<dialog id="zoom"><div class="top"><span id="zoomTitle"></span><button id="close">关闭 Esc</button></div><img id="zoomImage" alt="放大"></dialog>
<script>
const $=s=>document.querySelector(s),KEY='nju-triplet-review-60000-v1',roles=[['content','输入图','保留内容与结构'],['reference','参考图','提供色调风格'],['target','输出图','生成结果 · 待审核']];
let state={split:'pilot',search:'',pair:null,rejects:{},stars:{},history:[]};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let item=null,index=0,total=0,request=0,loading=true;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('#message').textContent='本地保存失败，请及时导出审核结果。'}};
$('#split').value=state.split;$('#search').value=state.search;
for(const [role,title,note] of roles){let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="label">${title}<span>${note}</span></div><div class="stage"><span class="wait" id="${role}Wait">加载中…</span><img id="${role}Image" alt="${title}"></div><div class="detail"><div id="${role}Key"></div><div id="${role}Size"></div><a id="${role}Original" target="_blank" rel="noopener">打开原图 ↗</a></div>`;$('#cards').append(c);$('#'+role+'Image').onclick=()=>{if(!item)return;$('#zoomTitle').textContent=title+' · '+item.pair_id;$('#zoomImage').src='/image/'+item.pair_id+'/'+role;$('#zoom').showModal()}}
function stats(){const r=Object.keys(state.rejects).length,s=Object.keys(state.stars).length;$('#stats').textContent=`${total?index+1:0} / ${total.toLocaleString()} 组 · 全库 60,000 组 · 已标剔除 ${r} · 优质 ${s}`;$('#star').textContent=item&&state.stars[item.pair_id]?'取消优质 S':'标为优质 S';$('#undo').disabled=!state.history.length}
async function show(n,preferred=''){let t=++request;loading=true;$('#reject').disabled=true;$('#message').textContent='';state.split=$('#split').value;state.search=$('#search').value;let q=new URLSearchParams({split:state.split,search:state.search,index:Math.max(0,n),pair:preferred});try{const response=await fetch('/api/pairs?'+q);if(!response.ok)throw Error('请求失败 '+response.status);const d=await response.json();if(t!==request)return;total=d.total;index=d.index;item=d.items[0]||null;$('#cards').hidden=!item;$('#empty').hidden=!!item;$('#prev').disabled=!item||index===0;$('#next').disabled=!item||index===total-1;$('#jump').max=total;$('#jump').value=item?index+1:0;$('#current').textContent=item?item.pair_id+' · '+item.split+(state.rejects[item.pair_id]?' · 已标剔除':' · 默认保留'):'';stats();if(!item){loading=false;return}state.pair=item.pair_id;save();let loaded=0;for(const [role] of roles){const img=$('#'+role+'Image'),wait=$('#'+role+'Wait');wait.hidden=false;wait.textContent='加载中…';img.onload=()=>{if(t!==request)return;wait.hidden=true;loaded++;if(loaded===3){loading=false;$('#reject').disabled=false}};img.onerror=()=>{if(t===request){wait.textContent='图片加载失败，可尝试打开原图';loading=true}};img.src='/image/'+item.pair_id+'/'+role;$('#'+role+'Key').textContent=role==='target'?item.pair_id+'.png':item[role+'_key'];$('#'+role+'Size').textContent=role==='target'?`${item.width} × ${item.height} · PNG`:'按完整构图显示 · 可打开原图核查';$('#'+role+'Original').href='/image/'+item.pair_id+'/'+role+'?original=1'}}catch(e){if(t===request)$('#message').textContent='连接失败：'+e.message+'。请检查 SSH 连接，刷新后继续。'}}
$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);$('#random').onclick=()=>{if(total>1)show((index+1+Math.floor(Math.random()*(total-1)))%total)};$('#go').onclick=()=>show(Math.min(total-1,Math.max(0,(Number($('#jump').value)||1)-1)));$('#jump').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};$('#split').onchange=()=>show(0);let timer;$('#search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>show(0),250)};
$('#reject').onclick=()=>{if(!item||loading)return;state.history.push({id:item.pair_id,was:!!state.rejects[item.pair_id]});state.history=state.history.slice(-100);state.rejects[item.pair_id]=true;delete state.stars[item.pair_id];save();show(index+1)};$('#star').onclick=()=>{if(!item||loading)return;let id=item.pair_id;if(state.stars[id])delete state.stars[id];else{state.stars[id]=true;delete state.rejects[id]}save();stats()};$('#undo').onclick=()=>{let h=state.history.pop();if(!h)return;if(h.was)state.rejects[h.id]=true;else delete state.rejects[h.id];save();$('#split').value='all';$('#search').value='';show(0,h.id)};
$('#export').onclick=()=>{let payload={collection:'nju-triplets-60000-v1',exported_at:new Date().toISOString(),total:60000,default_decision:'keep',instructions:'Decisions apply to triplets only, never to source photographs. No files have been deleted.',cursor_pair:state.pair,reviewed:[...Object.keys(state.rejects).map(pair_id=>({pair_id,decision:'reject'})),...Object.keys(state.stars).map(pair_id=>({pair_id,decision:'high_quality'}))]};let url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='triplet-review-'+new Date().toISOString().replaceAll(':','-').slice(0,19)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.collection!=='nju-triplets-60000-v1')throw Error('请选择三元组审核JSON，不能使用原图审核文件');for(const r of d.reviewed||[]){if(r.decision==='reject'){state.rejects[r.pair_id]=true;delete state.stars[r.pair_id]}else if(r.decision==='high_quality'){state.stars[r.pair_id]=true;delete state.rejects[r.pair_id]}}save();stats();$('#message').textContent='已导入三元组审核记录。'}catch(err){$('#message').textContent=err.message}finally{e.target.value=''}};
$('#close').onclick=()=>$('#zoom').close();document.addEventListener('keydown',e=>{if(e.target.matches('input,select')||$('#zoom').open)return;if(e.key==='ArrowRight'||e.key===' '&&!e.target.matches('button')){e.preventDefault();show(index+1)}else if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}else if(e.key.toLowerCase()==='x'&&!e.repeat){e.preventDefault();$('#reject').click()}else if(e.key.toLowerCase()==='s'){e.preventDefault();$('#star').click()}else if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click()}});show(0,state.pair||'');
</script></html>
