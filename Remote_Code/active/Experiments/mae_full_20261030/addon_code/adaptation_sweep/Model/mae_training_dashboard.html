<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAE Tone · Training Observatory</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--panel:#121c29;--line:#28364b;--text:#e9f1fc;--muted:#91a2b8;--blue:#66b4ff;--orange:#ffbc73;--green:#6bdeb4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1460px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:29px;margin:0;font-weight:650;letter-spacing:-.7px}p{margin:6px 0;color:var(--muted)}.live{color:var(--green);background:#14372f;padding:6px 12px;border-radius:30px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat,.panel,.run{border:1px solid var(--line);background:var(--panel);border-radius:14px}.stat{padding:16px 20px}.stat strong{display:block;font-size:26px}.stat span,.muted{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{background:#1d2a3d;border:1px solid #354963;border-radius:7px;padding:7px 12px;color:var(--text)}.panel{padding:22px;margin-bottom:22px}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px}.blue{color:var(--blue)}.orange{color:var(--orange)}canvas{width:100%;display:block}.runs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.run{padding:16px;cursor:pointer}.run.active{border-color:var(--blue)}.run h3{margin:0;display:flex;justify-content:space-between;font-size:15px}.badge{font-size:11px;color:var(--green)}.bar{height:5px;background:#263347;border-radius:3px;margin:12px 0}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.loss{display:flex;gap:20px;margin-top:12px}.loss b{font-size:17px;font-variant-numeric:tabular-nums}.loss small{display:block;color:var(--muted)}.foot{margin:20px 0;font-size:12px;color:var(--muted)}#preview{max-width:1024px;width:100%;border-radius:8px;margin-top:14px}#error{color:#ff9292}.pill{font-size:11px;padding:2px 7px;border:1px solid #384961;border-radius:5px}#detail{margin-top:14px}.chartwrap{position:relative}#tooltip{position:absolute;display:none;pointer-events:none;background:#080e17;border:1px solid #455b75;padding:8px 12px;border-radius:7px;font-size:12px;white-space:pre;z-index:3}.run:hover{background:#172335}@media(max-width:1050px){.runs{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.runs{grid-template-columns:1fr}.toolbar{align-items:flex-start}h1{font-size:23px}}
</style>
<main><header><div><h1>MAE Tone <span style="color:#8092a9;font-weight:400">/ Training Observatory</span></h1><p>完整摄影调色模型 · <span id="parallelCount">8 GPU</span>并行 · 训练与验证实时曲线</p></div><div class="live" id="connection">连接中</div></header>
<div class="stats"><div class="stat"><span>实验总进度</span><strong id="progress">—</strong></div><div class="stat"><span>运行 / 完成</span><strong id="running">—</strong></div><div class="stat"><span>预计剩余时间</span><strong id="eta">估算中</strong></div><div class="stat"><span>节点</span><strong style="font-size:22px">trinity-2-23</strong></div></div>
<section class="panel"><div class="toolbar"><strong id="selectedTitle">等待训练任务</strong><select id="runSelect"></select><select id="metric"><option value="1">Total loss</option><option value="2">RGB L1</option><option value="3">Gradient loss</option></select><label class="muted">平滑 <input id="smooth" type="range" min="0" max="95" value="75"></label></div><p id="detail">页面每5秒刷新。训练在远端独立运行，本机断开不影响任务。</p><div class="legend"><span class="blue">━ Train（平滑，浅线为原始记录）</span><span class="orange">━ Valid（固定验证集）</span><span>┆ 部分解冻微调起点</span></div><div class="chartwrap"><canvas id="hero" height="350"></canvas><div id="tooltip"></div></div><div id="error"></div></section>
<div class="runs" id="runs"></div><section class="panel" style="margin-top:22px"><strong>固定验证样例</strong><p>每行从左到右：输入 / 参考 / 生成目标 / 当前模型输出。验证时更新。</p><img id="preview" alt="等待首次验证生成预览" hidden></section><div class="foot" id="updated"></div><div class="foot">曲线用于监测优化过程；验证误差衡量对生成目标的拟合，不代表独立审美分数。测试集不参与训练或此页面。</div></main>
<script>
let state=null,selected='',busy=false;const $=id=>document.getElementById(id);const format=x=>Number.isFinite(x)?x.toFixed(5):'—';const duration=s=>!Number.isFinite(s)?'估算中':s<60?`${Math.ceil(s)}秒`:s<3600?`${Math.ceil(s/60)}分钟`:`${(s/3600).toFixed(1)}小时`;const labels={running:'训练中',validating:'验证中',completed:'已完成',failed:'失败',interrupted:'已中断'};
function chart(canvas,run,mini=false){const box=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=box.width,h=mini?105:350;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.height=h+'px';const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let key=+$('metric').value,train=run.train||[],valid=run.valid||[],all=[...train,...valid].filter(p=>Number.isFinite(p[key]));if(!all.length){ctx.fillStyle='#91a2b8';ctx.fillText('等待第一条记录…',20,h/2);return;}const pad=mini?{l:2,r:2,t:10,b:4}:{l:62,r:18,t:25,b:38},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,xmax=Math.max(1,...all.map(p=>p[0]));let ymin=Math.min(...all.map(p=>p[key])),ymax=Math.max(...all.map(p=>p[key]));const yr=Math.max(.0001,ymax-ymin);ymin=Math.max(0,ymin-yr*.08);ymax+=yr*.1;const X=x=>pad.l+x/xmax*cw,Y=y=>pad.t+(ymax-y)/(ymax-ymin)*ch;
if(!mini){ctx.font='11px system-ui';ctx.strokeStyle='#263448';ctx.fillStyle='#91a2b8';for(let i=0;i<=4;i++){let y=pad.t+i*ch/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText((ymax-i*(ymax-ymin)/4).toFixed(4),5,y+4);}for(let i=0;i<=4;i++){let x=pad.l+i*cw/4;ctx.fillText(Math.round(i*xmax/4).toLocaleString(),x-10,h-13);}const boundary=run.status?.heads_steps;if(boundary&&boundary<=xmax){ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(X(boundary),pad.t);ctx.lineTo(X(boundary),h-pad.b);ctx.strokeStyle='#7e93ae';ctx.stroke();ctx.setLineDash([]);ctx.fillText('Joint',Math.min(X(boundary)+5,w-48),17);}}
function line(data,color,width,alpha=1,smoothing=0){if(!data.length)return;ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;let ema=data[0][key];data.forEach((p,i)=>{ema=i?smoothing*ema+(1-smoothing)*p[key]:p[key];i?ctx.lineTo(X(p[0]),Y(ema)):ctx.moveTo(X(p[0]),Y(ema));});ctx.stroke();ctx.globalAlpha=1;}line(train,'#66b4ff',1,.2);line(train,'#66b4ff',mini?1.4:2,1,+$('smooth').value/100);line(valid,'#ffbc73',mini?1.4:2);if(!mini){ctx.fillStyle='#ffbc73';for(const p of valid){ctx.beginPath();ctx.arc(X(p[0]),Y(p[key]),2.7,0,7);ctx.fill();}canvas.onmousemove=e=>{const position=(e.offsetX-pad.l)/cw*xmax;let closest=all.reduce((a,b)=>Math.abs(a[0]-position)<Math.abs(b[0]-position)?a:b);$('tooltip').style.display='block';$('tooltip').style.left=Math.min(e.offsetX+12,w-190)+'px';$('tooltip').style.top='35px';$('tooltip').textContent=`Step ${closest[0].toLocaleString()}\nLoss ${format(closest[key])}`;};canvas.onmouseleave=()=>$('tooltip').style.display='none';}}
function render(){if(!state)return;const runs=state.runs;if(!selected||!runs.some(r=>r.name===selected))selected=runs[0]?.name||'';const run=runs.find(r=>r.name===selected);let done=0,total=0,completed=0,running=0;for(const r of runs){done+=r.status.step||0;total+=r.status.total_steps||0;completed+=r.status.state==='completed';running+=['running','validating'].includes(r.status.state);}const expected=state.supervisor.jobs?.length||8;$('parallelCount').textContent=expected+' GPU';$('progress').textContent=total?`${(100*done/total).toFixed(1)}%`:'准备中';$('running').textContent=`${running} / ${completed}`;$('eta').textContent=completed===expected?'已完成':duration((()=>{const a=runs.map(r=>r.eta_seconds).filter(Number.isFinite);return a.length?Math.max(...a):NaN})());$('runSelect').innerHTML=runs.map(r=>`<option value="${r.name}" ${r.name===selected?'selected':''}>${r.name}</option>`).join('');$('runs').innerHTML=runs.map(r=>{const s=r.status,train=r.train.at(-1),valid=r.valid.at(-1);return `<article class="run ${r.name===selected?'active':''}" data-name="${r.name}"><h3>${r.name}<span class="badge">${labels[s.state]||'准备中'}</span></h3><div class="row"><span>${s.stage==='hybrid'?'前8层LoRA＋末4层全量':s.stage==='joint'?'末4层联合微调':'冻结骨干训练'}</span><span>${duration(r.eta_seconds)}</span></div><div class="bar"><i style="width:${Math.min(100,100*(s.step||0)/(s.total_steps||1))}%"></i></div><div class="row"><span>${(s.step||0).toLocaleString()} / ${(s.total_steps||0).toLocaleString()}</span><span>epoch ${((s.consumed||0)/(s.train_count||1)).toFixed(2)}</span></div><canvas id="mini_${r.name}" height="105"></canvas><div class="loss"><div><small>Train L1</small><b class="blue">${format(train?.[2])}</b></div><div><small>Valid L1</small><b class="orange">${format(valid?.[2])}</b></div></div></article>`;}).join('');document.querySelectorAll('.run').forEach(el=>el.onclick=()=>{selected=el.dataset.name;render();});for(const r of runs)chart($('mini_'+r.name),r,true);if(run){const s=run.status;$('selectedTitle').textContent=run.name;$('detail').textContent=`K=${s.local_rank} · seed=${s.seed}${s.lora_rank?" · LoRA r="+s.lora_rank:""} · 原比例长边 ${run.config.long_edge}px · 有效batch ${run.config.effective_batch??run.config.accumulate} · 最优验证L1 ${format(s.best_valid)} @ ${s.best_step||0}步`;$('error').textContent=s.error||'';chart($('hero'),run);if(s.preview){$('preview').hidden=false;$('preview').src='/preview/'+encodeURIComponent(run.name)+'?v='+run.valid.at(-1)?.[0];}else $('preview').hidden=true;}$('updated').textContent=`更新：${new Date(state.time_unix*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}（北京时间） · 网页服务与训练均驻留计算节点`;}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error(r.status);state=await r.json();$('connection').textContent='● 实时连接';$('connection').style.color='#6bdeb4';render();}catch(e){$('connection').textContent='连接断开 · 自动重试';$('connection').style.color='#ff9292';}finally{busy=false;}}
$('runSelect').onchange=e=>{selected=e.target.value;render();};$('metric').onchange=render;$('smooth').oninput=render;window.addEventListener('resize',render);refresh();setInterval(refresh,5000);
</script></html>
